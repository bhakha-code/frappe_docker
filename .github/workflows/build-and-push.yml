name: Build and Push Custom Image to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bhakha-code/erpnext-custom
  IMAGE_TAG: v16.22.0

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Show apps.json content
        run: cat apps.json

      - name: Validate apps manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          apps = json.loads(Path("apps.json").read_text())
          urls = [app.get("url", "") for app in apps]
          if not urls:
            raise SystemExit("apps.json is empty")

          invalid = [u for u in urls if not u.startswith("https://github.com/")]
          if invalid:
            raise SystemExit(f"Invalid app URLs in apps.json: {', '.join(invalid)}")

          print(f"apps.json contains {len(urls)} apps")
          print("Included app URLs:")
          for url in urls:
              print(f"- {url}")
          PY

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: images/layered/Containerfile
          no-cache: true
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          secret-files: |
            apps_json=apps.json
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          push: true

      - name: Verify required apps in pushed image
        run: |
          set -euo pipefail

          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Checking image: ${IMAGE}"

          APP_DIRS=$(docker run --rm --platform linux/arm64 --entrypoint sh "${IMAGE}" -lc "find /home/frappe/frappe-bench/apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort")
          export APP_DIRS

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          apps = json.loads(Path("apps.json").read_text())

          expected = []
          for app in apps:
            url = app["url"].rstrip("/")
            repo = url.split("/")[-1]
            if repo.endswith(".git"):
              repo = repo[:-4]
            expected.append(repo.replace("-", "_"))

          in_image = [line.strip() for line in os.environ.get("APP_DIRS", "").splitlines() if line.strip()]
          if not in_image:
            raise SystemExit("No app directories detected in built image")
          missing = sorted(set(expected) - set(in_image))

          print("Expected app directories from apps.json:")
          for app in sorted(expected):
            print(f"- {app}")

          print("App directories found in built image:")
          for app in sorted(in_image):
            print(f"- {app}")

          if missing:
            raise SystemExit(f"Missing app directories in image: {', '.join(missing)}")
          PY
