name: Build and Push Custom Image to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bhakha-code/erpnext-custom
  IMAGE_TAG: v16.22.0

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Show apps.json content
        run: cat apps.json

      - name: Validate apps manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          apps = json.loads(Path("apps.json").read_text())
          urls = [app.get("url", "") for app in apps]
          required = {
              "https://github.com/frappe/telephony",
              "https://github.com/frappe/helpdesk",
          }
          missing = sorted(required - set(urls))

          if missing:
              raise SystemExit(f"Missing required apps in apps.json: {', '.join(missing)}")

          print(f"apps.json contains {len(urls)} apps")
          print("Included app URLs:")
          for url in urls:
              print(f"- {url}")
          PY

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: images/layered/Containerfile
          no-cache: true
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          secrets: |
            id=apps_json,src=apps.json
          platforms: linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          push: true
